name: Supabase keep-alive

# The Supabase free tier auto-pauses a project after 7 days of no database activity. A paused
# project means a silently offline demo or pilot. This is the mitigation from the roadmap's risk
# register — a daily read that costs nothing and keeps the project awake.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::warning::SUPABASE_URL secret not set — skipping keep-alive."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/app_config?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/out
          [ "$code" = "200" ] || { echo "::error::Keep-alive ping failed"; exit 1; }
